<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>About ClaudeLander</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
    }

    .about-container {
      text-align: center;
      max-width: 500px;
    }

    .app-title {
      font-size: 32px;
      font-weight: bold;
      background: linear-gradient(135deg, #ffd700 0%, #ff8c00 50%, #e06c75 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .version {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
    }

    .description {
      font-size: 13px;
      line-height: 1.6;
      color: #b0b0b0;
      margin-bottom: 16px;
    }

    .description p {
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .credits {
      font-size: 12px;
      color: #666;
      margin-bottom: 20px;
    }

    .credits a {
      color: #ff8c00;
      text-decoration: none;
    }

    .credits a:hover {
      text-decoration: underline;
    }

    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .close-btn {
      background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
      color: #1a1a2e;
    }

    .close-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(255, 140, 0, 0.4);
    }

    .close-btn:active {
      transform: translateY(0);
    }

    .update-btn {
      background: #3c3c3c;
      color: #d4d4d4;
      border: 1px solid #555;
    }

    .update-btn:hover:not(:disabled) {
      background: #4a4a4a;
      transform: translateY(-2px);
    }

    .update-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .download-btn {
      background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
      color: #1a1a2e;
    }

    .download-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(74, 222, 128, 0.4);
    }

    .download-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .update-status {
      font-size: 12px;
      margin-top: 8px;
      min-height: 18px;
    }

    .update-status.checking {
      color: #888;
    }

    .update-status.available {
      color: #4ade80;
    }

    .update-status.current {
      color: #888;
    }

    .update-status.error {
      color: #e06c75;
    }

    .separator {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff8c00, transparent);
      margin: 16px auto;
    }
  </style>
</head>
<body>
  <div class="about-container">
    <h1 class="app-title">ClaudeLander</h1>
    <div class="version" id="version">Version 1.0.0</div>

    <div class="separator"></div>

    <div class="description">
      <p>A cross-platform session manager for Claude Code.</p>
      <p>Manage multiple Claude Code terminal sessions in one unified interface with real-time status detection, session groups, and persistent storage.</p>
    </div>

    <div class="tagline">Unified Session Management</div>

    <div class="separator"></div>

    <div class="credits">
      Created by <strong>Will Long II</strong> & <strong>Claude</strong><br>
      <span style="color: #555;" id="copyright">&copy; 2024-2025</span>
    </div>

    <div class="button-group">
      <button class="btn update-btn" id="updateBtn" onclick="checkForUpdate()">Check for Updates</button>
      <button class="btn download-btn" id="downloadBtn" onclick="downloadUpdate()" style="display: none;">Download Update</button>
      <button class="btn close-btn" onclick="window.close()">OK</button>
    </div>
    <div class="update-status" id="updateStatus"></div>
  </div>

  <script>
    // Get version from URL query parameter
    const params = new URLSearchParams(window.location.search);
    const version = params.get('version') || '1.0.0';
    document.getElementById('version').textContent = `Version ${version}`;

    async function checkForUpdate() {
      const btn = document.getElementById('updateBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const status = document.getElementById('updateStatus');

      btn.disabled = true;
      btn.textContent = 'Checking...';
      downloadBtn.style.display = 'none';
      status.className = 'update-status checking';
      status.textContent = 'Checking for updates...';

      try {
        const result = await window.electronAPI.checkForUpdate();

        if (result.error) {
          status.className = 'update-status error';
          status.textContent = 'Failed to check for updates';
        } else if (result.updateAvailable) {
          status.className = 'update-status available';
          status.textContent = `Version ${result.version} is available!`;
          downloadBtn.style.display = 'inline-block';
        } else {
          status.className = 'update-status current';
          status.textContent = 'You are running the latest version';
        }
      } catch (e) {
        status.className = 'update-status error';
        status.textContent = 'Failed to check for updates';
      }

      btn.disabled = false;
      btn.textContent = 'Check for Updates';
    }

    async function downloadUpdate() {
      const downloadBtn = document.getElementById('downloadBtn');
      const status = document.getElementById('updateStatus');

      downloadBtn.disabled = true;
      downloadBtn.textContent = 'Downloading...';
      status.className = 'update-status checking';
      status.textContent = 'Starting download...';

      try {
        await window.electronAPI.downloadUpdate();
        status.textContent = 'Downloading... 0%';
      } catch (e) {
        status.className = 'update-status error';
        status.textContent = 'Failed to start download';
        downloadBtn.disabled = false;
        downloadBtn.textContent = 'Download Update';
      }
    }

    function restartAndUpdate() {
      window.electronAPI.restartAndUpdate();
    }

    // Listen for download progress
    window.electronAPI.onDownloadProgress((percent) => {
      const status = document.getElementById('updateStatus');
      status.className = 'update-status checking';
      status.textContent = `Downloading... ${percent.toFixed(0)}%`;
    });

    // Listen for download completion
    window.electronAPI.onUpdateDownloaded((version) => {
      const downloadBtn = document.getElementById('downloadBtn');
      const status = document.getElementById('updateStatus');

      status.className = 'update-status available';
      status.textContent = `Version ${version} downloaded! Ready to install.`;

      downloadBtn.textContent = 'Restart Now';
      downloadBtn.className = 'btn download-btn';
      downloadBtn.disabled = false;
      downloadBtn.onclick = restartAndUpdate;
      downloadBtn.style.display = 'inline-block';
    });

    // Listen for errors
    window.electronAPI.onDownloadError((error) => {
      const downloadBtn = document.getElementById('downloadBtn');
      const status = document.getElementById('updateStatus');

      status.className = 'update-status error';
      status.textContent = `Download failed: ${error}`;

      downloadBtn.textContent = 'Retry Download';
      downloadBtn.disabled = false;
      downloadBtn.onclick = downloadUpdate;
    });
    // Dynamic copyright year
    document.getElementById('copyright').textContent = '\u00A9 2024-' + new Date().getFullYear();
  </script>
</body>
</html>
