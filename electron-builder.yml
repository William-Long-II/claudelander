appId: com.claudelander.app
productName: ClaudeLander
copyright: Copyright © 2024-2025

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

# Unpack MCP server, hooks, and native modules from asar
asarUnpack:
  - dist/mcp-server/**/*
  - dist/hooks/**/*
  - dist/main/vector-search/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/sodium-native/**/*
  - node_modules/tree-sitter/**/*
  - node_modules/tree-sitter-*/**/*
  - node_modules/sqlite-vec/**/*
  - node_modules/sqlite-vec-*/**/*
  - node_modules/@huggingface/**/*
  - node_modules/onnxruntime-node/**/*
  - node_modules/onnxruntime-common/**/*

# Include icon files for tray icon and sound files
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: resources/sounds
    to: sounds

# Auto-update configuration
publish:
  provider: github
  owner: William-Long-II
  repo: claudelander

# macOS configuration
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

# Notarization (runs after signing)
afterSign: scripts/notarize.js

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Windows configuration
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-Setup-${version}.${ext}"

# Linux configuration
linux:
  icon: build/icon.png
  category: Development
  maintainer: "Will Long II <sytanek@gmail.com>"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

# Disable electron-builder's native module rebuild - it tries to rebuild ALL
# native modules including tree-sitter which is incompatible with Electron's V8.
# The postinstall script handles rebuilding only compatible modules
# (better-sqlite3, sodium-native, sqlite-vec) via electron-rebuild.
npmRebuild: false
